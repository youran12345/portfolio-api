# Netlify configuration for the Back-End API (Netlify Functions)
# Base directory: server  →  paths below are relative to server/

[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Route /api/* to the Express serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
